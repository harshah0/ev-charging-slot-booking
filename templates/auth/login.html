{% extends "base.html" %}

{% block title %}Login | Smart EV Charging Slot Booking System{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-3 fw-bold">Login</h1>
        <p class="text-muted mb-4">Sign in to continue managing EV charging slots.</p>

        <form method="post" action="{{ url_for('auth.login_post') }}" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ form.get('email', '') if form else '' }}" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>

          <button type="submit" class="btn btn-dark w-100">Login</button>
        </form>

        <div class="mt-3 text-center">
          <a href="{{ url_for('auth.register') }}" class="link-secondary">Create an account</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
