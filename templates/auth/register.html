{% extends "base.html" %}

{% block title %}Register | Smart EV Charging Slot Booking System{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-3 fw-bold">Create account</h1>
        <p class="text-muted mb-4">Set up your EV charging booking profile.</p>

        <form method="post" action="{{ url_for('auth.register_post') }}" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ form.get('username', '') if form else '' }}" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ form.get('email', '') if form else '' }}" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
            <div class="form-text">Use at least 8 characters with letters and numbers.</div>
          </div>

          <div class="mb-4">
            <label for="confirm_password" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
          </div>

          <button type="submit" class="btn btn-dark w-100">Register</button>
        </form>

        <div class="mt-3 text-center">
          <a href="{{ url_for('auth.login') }}" class="link-secondary">Already have an account?</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
