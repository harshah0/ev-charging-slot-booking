{% extends "base.html" %}

{% set is_edit = station is not none %}

{% block title %}{{ 'Edit' if is_edit else 'Add' }} Charging Station | Smart EV Charging Slot Booking System{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 fw-bold mb-3">{{ 'Edit' if is_edit else 'Add' }} Charging Station</h1>
        <form method="post" action="{{ url_for('stations.update_station', station_id=station.id) if is_edit else url_for('stations.create_station') }}" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label" for="station_name">Station Name</label>
              <input class="form-control" id="station_name" name="station_name" value="{{ form.get('station_name', station.station_name if station else '') if form or station else '' }}" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="address">Address</label>
              <input class="form-control" id="address" name="address" value="{{ form.get('address', station.address if station else '') if form or station else '' }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="city">City</label>
              <input class="form-control" id="city" name="city" value="{{ form.get('city', station.city if station else '') if form or station else '' }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="state">State</label>
              <input class="form-control" id="state" name="state" value="{{ form.get('state', station.state if station else '') if form or station else '' }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="latitude">Latitude</label>
              <input class="form-control" id="latitude" name="latitude" value="{{ form.get('latitude', station.latitude if station else '') if form or station else '' }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="longitude">Longitude</label>
              <input class="form-control" id="longitude" name="longitude" value="{{ form.get('longitude', station.longitude if station else '') if form or station else '' }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="total_slots">Total Slots</label>
              <input type="number" min="1" class="form-control" id="total_slots" name="total_slots" value="{{ form.get('total_slots', station.total_slots if station else '') if form or station else '' }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="charging_type">Charging Type</label>
              <select class="form-select" id="charging_type" name="charging_type" required>
                <option value="">Choose...</option>
                {% for charging_type in charging_types %}
                  <option value="{{ charging_type }}" {% if (form.get('charging_type') if form else station.charging_type if station else '') == charging_type %}selected{% endif %}>{{ charging_type }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="mt-4 d-flex gap-2">
            <button class="btn btn-dark" type="submit">{{ 'Update' if is_edit else 'Save' }}</button>
            <a href="{{ url_for('stations.list_stations') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
